[project]
name = "exoplanet-hunter-backend"
version = "0.1.0"
description = "AI Exoplanet Hunter - backend service for TESS light-curve analysis and transit detection"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
]

[project.optional-dependencies]
mast = [
    "astroquery>=0.4.7",
    "astropy>=6.1",
]
science = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "astropy>=6.1",
    "lightkurve>=2.5",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "astroquery>=0.4.7",
]
ml = [
    "scikit-learn>=1.5",
    "torch>=2.5",
    "optuna>=4.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["lightkurve.*", "astroquery.*", "astropy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov-report=term-missing -m \"not live\""
testpaths = ["tests"]
markers = [
    "live: manually-invoked test that makes a real network call to MAST (excluded by default; run with `pytest -m live`)",
]
